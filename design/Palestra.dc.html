<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #e5e5e7; } a:hover { color: #fafafa; }
  </style>
</helmet>

<div style="width: 390px; height: 870px; background: linear-gradient(180deg, #0a0a0c 0%, #000000 55%); font-family: Poppins, system-ui, sans-serif; color: #fafafa; box-sizing: border-box; overflow: hidden; position: relative;">

  <div style="padding: 14px 16px 0;">
    <div style="font-size: 24px; font-weight: 700; letter-spacing: -0.4px;">Palestra</div>
  </div>

  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px;">

    <!-- HERO: la scheda attiva coi suoi giorni. E' il gesto quotidiano, quindi e' l'hero. -->
    <div style="border-radius: 16px; background: linear-gradient(180deg, #3a3a3d 0%, #232326 100%); border: 1px solid #101013; border-top-color: #4a4a4d; overflow: hidden;">
      <div style="padding: 13px 16px 11px; display: flex; align-items: center; gap: 10px;">
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.9px; text-transform: uppercase; color: #a1a1aa;">Scheda attiva</div>
          <div style="font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">PPL FB</div>
        </div>
        <div style="font-size: 11px; font-weight: 500; color: #a1a1aa; flex-shrink: 0;">4 giorni</div>
      </div>

      <div style="height: 1px; background: rgba(255,255,255,0.08);"></div>

      <div style="height: 46px; display: flex; align-items: center; gap: 11px; padding: 0 16px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M6 4.5v15l13-7.5z"/></svg>
        <div style="font-size: 15px; font-weight: 500; flex-grow: 1;">Push</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.08); margin-left: 44px;"></div>
      <div style="height: 46px; display: flex; align-items: center; gap: 11px; padding: 0 16px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M6 4.5v15l13-7.5z"/></svg>
        <div style="font-size: 15px; font-weight: 500; flex-grow: 1;">Pull</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.08); margin-left: 44px;"></div>
      <div style="height: 46px; display: flex; align-items: center; gap: 11px; padding: 0 16px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M6 4.5v15l13-7.5z"/></svg>
        <div style="font-size: 15px; font-weight: 500; flex-grow: 1;">Legs</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.08); margin-left: 44px;"></div>
      <div style="height: 46px; display: flex; align-items: center; gap: 11px; padding: 0 16px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M6 4.5v15l13-7.5z"/></svg>
        <div style="font-size: 15px; font-weight: 500; flex-grow: 1;">Full body</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>

    <!-- livello nudo -->
    <div style="display: flex; flex-direction: column; margin-top: 2px;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 2px 6px;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #a1a1aa;">Ultimi allenamenti</div>
      </div>

      <div style="height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 2px;">
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 14px; font-weight: 600;">Push</div>
          <div style="font-size: 11px; font-weight: 400; color: #71717a;">5 set · 4.280 kg</div>
        </div>
        <div style="font-size: 12px; font-weight: 500; color: #71717a; flex-shrink: 0;">5 set</div>
      </div>
      <div style="height: 1px; background: #1e1e22;"></div>
      <div style="height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 2px;">
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 14px; font-weight: 600;">Legs</div>
          <div style="font-size: 11px; font-weight: 400; color: #71717a;">4 set · 6.100 kg</div>
        </div>
        <div style="font-size: 12px; font-weight: 500; color: #71717a; flex-shrink: 0;">4 set</div>
      </div>
      <div style="height: 1px; background: #1e1e22;"></div>
      <div style="height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 2px;">
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 14px; font-weight: 600;">Pull</div>
          <div style="font-size: 11px; font-weight: 400; color: #71717a;">6 set · 3.940 kg</div>
        </div>
        <div style="font-size: 12px; font-weight: 500; color: #71717a; flex-shrink: 0;">6 set</div>
      </div>
    </div>

    <!-- il bottone a piena larghezza diventa un collegamento -->
    <div style="height: 42px; display: flex; align-items: center; gap: 9px; padding: 0 2px; margin-top: 2px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
      <div style="font-size: 14px; font-weight: 600; color: #e5e5e7; flex-grow: 1;">Le mie schede</div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"/></svg>
    </div>

  </div>

  <!-- tab bar -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #0a0a0c; border-top: 1px solid #1e1e22; display: flex; align-items: flex-start; padding-top: 10px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/></svg>
      <div style="font-size: 10px; font-weight: 500; color: #71717a;">Oggi</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
      <div style="font-size: 10px; font-weight: 500; color: #71717a;">Progressi</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
      <div style="font-size: 10px; font-weight: 500; color: #fafafa;">Palestra</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <div style="font-size: 10px; font-weight: 500; color: #71717a;">Profilo</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
