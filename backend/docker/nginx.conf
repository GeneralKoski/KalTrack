user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    # Un giro di sincronizzazione porta qualche centinaio di righe: tenerlo in
    # memoria evita il passaggio dal disco temporaneo a ogni richiesta.
    client_body_buffer_size 512k;
    # Le richieste passano da un reverse proxy: senza questo Laravel vedrebbe
    # solo l'IP del proxy in ogni log e in ogni throttle.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # L'API non serve file caricati: qualunque cosa non sia una rotta
        # conosciuta finisce a Laravel, che risponde 404 come si deve.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # I file nascosti non escono mai: .env in cima alla lista.
        location ~ /\. { deny all; }
    }
}
